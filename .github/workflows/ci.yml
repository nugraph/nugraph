name: ci

on:
  pull_request:
  workflow_dispatch:

env:
  NUGRAPH_DIR: ${{ github.workspace }}
  NUGRAPH_DATA: ${{ github.workspace }}/data
  NUGRAPH_LOG: ${{ github.workspace}}/log

jobs:

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - name: building nugraph
      uses: ./.github/actions/build-nugraph

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    needs: build
    steps:
    - name: building nugraph
      uses: ./.github/actions/build-nugraph
    - name: analysing the code with pylint
      run: pylint --fail-under=8 $(git ls-files '*.py')

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    needs: build
    steps:
    - name: building nugraph
      uses: ./github/actions/build-nugraph
    - name: running python unit tests
      run: pytest
