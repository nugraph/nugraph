name: ci

on:
  pull_request:
  workflow_dispatch:

env:
  NUGRAPH_DIR: ${{ github.workspace }}
  NUGRAPH_DATA: ${{ github.workspace }}/data
  NUGRAPH_LOG: ${{ github.workspace}}/log

jobs:

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - name: checking out repository
      uses: actions/checkout@v4
    - name: building nugraph
      uses: ./.github/actions/build-conda

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    needs: build
    steps:
    - name: checking out repository
      uses: actions/checkout@v4
    - name: initializing conda environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        activate-environment: nugraph-cpu
        auto-activate-base: false
    - name: caching conda packages
      uses: actions/cache@v3
      with:
        path: ${{ env.CONDA }}/pkgs
        key:
          conda-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nugraph-cpu.yaml') }}
        restore-keys: |
          conda-${{ runner.os }}-${{ runner.arch }}-
    - name: updating conda environment
      run: mamba env update -n nugraph-cpu -f nugraph-cpu.yaml
    - name: installing local packages
      run: |
        conda list
        pip install --no-deps -e ./pynuml
        pip install --no-deps -e ./nugraph
    - name: analysing the code with pylint
      run: pylint --fail-under=6 $(git ls-files '*.py')

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    needs: build
    steps:
    - name: checking out repository
      uses: actions/checkout@v4
      with:
        lfs: true
    - name: initializing conda environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        activate-environment: nugraph-cpu
        auto-activate-base: false
    - name: caching conda packages
      uses: actions/cache@v3
      with:
        path: ${{ env.CONDA }}/pkgs
        key:
          conda-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nugraph-cpu.yaml') }}
        restore-keys: |
          conda-${{ runner.os }}-${{ runner.arch }}-
    - name: updating conda environment
      run: mamba env update -n nugraph-cpu -f nugraph-cpu.yaml
    - name: installing local packages
      run: |
        pip install --no-deps -e ./pynuml
        pip install --no-deps -e ./nugraph
    - name: running python unit tests
      run: pytest
