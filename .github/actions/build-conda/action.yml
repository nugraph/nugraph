name: build-conda

runs:
  using: "composite"
  steps:

  - name: initializing conda environment
    uses: conda-incubator/setup-miniconda@v3
    with:
      miniforge-version: latest
      activate-environment: nugraph-cpu
      auto-update-conda: true
      auto-activate-base: false

  - name: caching conda packages
    uses: actions/cache@v3
    with:
      path: ${{ env.CONDA }}/pkgs
      key:
        conda-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nugraph-cpu.yaml') }}
      restore-keys: |
        conda-${{ runner.os }}-${{ runner.arch }}-

  - name: updating conda environment
    shell: bash
    run: |
      mamba list
      mamba env update -n nugraph-cpu -f nugraph-cpu.yaml
